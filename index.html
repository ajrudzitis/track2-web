<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="A subway simulation rendered as a terminal UI in your browser." />
    <title>trains.aleksrudzitis.com</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <noscript>
      <p class="noscript">
        trains.aleksrudzitis.com runs a terminal UI in the browser. It needs
        JavaScript enabled to render.
      </p>
    </noscript>
    <div id="terminal"></div>
    <div id="keypad" aria-label="Touch controls">
      <div class="keypad-row">
        <button type="button" data-key="left"  aria-label="Left">←</button>
        <button type="button" data-key="down"  aria-label="Down">↓</button>
        <button type="button" data-key="up"    aria-label="Up">↑</button>
        <button type="button" data-key="right" aria-label="Right">→</button>
        <button type="button" data-key="minus" aria-label="Slow down">−</button>
        <button type="button" data-key="plus"  aria-label="Speed up">+</button>
      </div>
      <div class="keypad-row">
        <button type="button" data-key="a">a</button>
        <button type="button" data-key="h">h</button>
        <button type="button" data-key="lbracket" aria-label="Previous station">[</button>
        <button type="button" data-key="rbracket" aria-label="Next station">]</button>
        <button type="button" data-key="enter" aria-label="Enter">⏎</button>
        <button type="button" data-key="esc"   aria-label="Escape">esc</button>
        <button type="button" data-key="q">q</button>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
